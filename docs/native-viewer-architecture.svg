<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">Native PDF comparison viewer architecture</title>
  <desc id="desc">Old and new PDFs feed a NumPy and Pillow comparison engine, whose image layers are rendered in a PyQt QGraphicsScene and displayed by QGraphicsView.</desc>
  <style>
    .box { fill: #ffffff; stroke: #50627a; stroke-width: 2; rx: 10; }
    .engine { fill: #eef5ff; stroke: #3771c8; stroke-width: 2; rx: 10; }
    .scene { fill: #f6f2ff; stroke: #7557ad; stroke-width: 2; rx: 10; }
    .view { fill: #edf8f2; stroke: #31835e; stroke-width: 2; rx: 10; }
    text { font-family: Segoe UI, Arial, sans-serif; fill: #1d2a3a; }
    .heading { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; }
    .arrow { fill: none; stroke: #6b7c91; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7c91" />
    </marker>
  </defs>
  <rect x="25" y="65" width="160" height="100" class="box" />
  <text x="105" y="103" text-anchor="middle" class="heading">Old PDF</text>
  <text x="105" y="128" text-anchor="middle" class="sub">New PDF</text>
  <path d="M185 115 L247 115" class="arrow" />
  <rect x="255" y="45" width="210" height="140" class="engine" />
  <text x="360" y="85" text-anchor="middle" class="heading">NumPy engine</text>
  <text x="360" y="111" text-anchor="middle" class="sub">rasterize · align · diff</text>
  <text x="360" y="135" text-anchor="middle" class="sub">regions · statistics</text>
  <path d="M465 115 L527 115" class="arrow" />
  <rect x="535" y="35" width="205" height="160" class="scene" />
  <text x="638" y="72" text-anchor="middle" class="heading">QGraphicsScene</text>
  <text x="638" y="101" text-anchor="middle" class="sub">old / new layers</text>
  <text x="638" y="124" text-anchor="middle" class="sub">red / blue diffs</text>
  <text x="638" y="147" text-anchor="middle" class="sub">interactive regions</text>
  <path d="M740 115 L802 115" class="arrow" />
  <rect x="810" y="65" width="90" height="100" class="view" />
  <text x="855" y="105" text-anchor="middle" class="heading">View</text>
  <text x="855" y="128" text-anchor="middle" class="sub">zoom · pan</text>
</svg>
